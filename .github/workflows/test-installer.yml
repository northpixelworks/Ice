name: Test installer failure handling

on:
  # Push only on main; pull_request covers PR branches, so each runs once.
  push:
    branches: [main]
    paths:
      - build-and-install.sh
      - scripts/test-build-and-install.py
      - .github/workflows/test-installer.yml
  pull_request:
    paths:
      - build-and-install.sh
      - scripts/test-build-and-install.py
      - .github/workflows/test-installer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check shell syntax
        run: bash -n build-and-install.sh
      - name: Run isolated installer tests
        run: python3 scripts/test-build-and-install.py
