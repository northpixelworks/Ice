name: Test installer failure handling

on:
  # Push only on main; pull_request covers PR branches, so each runs once.
  push:
    branches: [main]
    paths:
      - build-and-install.sh
      - scripts/test-build-and-install.py
      - .github/workflows/test-installer.yml
  pull_request:
    paths:
      - build-and-install.sh
      - scripts/test-build-and-install.py
      - .github/workflows/test-installer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-tests:
    name: installer-tests (${{ matrix.os }}, Bash ${{ matrix.bash-major }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: system
            bash-major: 5
          # macOS ships Bash 3.2 as /bin/bash, which build-and-install.sh uses.
          - os: macos-latest
            bash: system
            bash-major: 3
          - os: macos-latest
            bash: homebrew
            bash-major: 5
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # The tests run the installer with the first bash on PATH. Put only the
      # chosen bash first, so setup-python's python3 stays in front of Homebrew's.
      - name: Select bash
        run: |
          mkdir -p "$RUNNER_TEMP/selected-bash"
          if [[ "${{ matrix.bash }}" == homebrew ]]; then
            brew list bash >/dev/null 2>&1 || brew install bash
            ln -s "$(brew --prefix bash)/bin/bash" "$RUNNER_TEMP/selected-bash/bash"
          elif [[ "$RUNNER_OS" == macOS ]]; then
            ln -s /bin/bash "$RUNNER_TEMP/selected-bash/bash"
          else
            ln -s "$(command -v bash)" "$RUNNER_TEMP/selected-bash/bash"
          fi
          echo "$RUNNER_TEMP/selected-bash" >> "$GITHUB_PATH"
      - name: Show bash version
        run: |
          command -v bash
          bash --version | head -n 1
          major="$(bash -c 'echo "${BASH_VERSINFO[0]}"')"
          [[ "$major" == "${{ matrix.bash-major }}" ]] || { echo "Expected Bash ${{ matrix.bash-major }}, got $major"; exit 1; }
      - name: Check shell syntax
        run: bash -n build-and-install.sh
      - name: Run isolated installer tests
        run: python3 scripts/test-build-and-install.py
